<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>LunexHub</title>
</head>
<body>
    <h1>Welcome, {{ username }}!</h1>

    <p>나만의 웹 애플리케이션 개발 공간입니다.</p>
    <p>현재 등록된 할 일: {{ todo_count }}개</p>

    <h2>Todo 입력</h2>

    <form action="" method="post">
        {% csrf_token %}

        <label for="todo_title">할 일:</label>

        <input
            type="text"
            id="todo_title"
            name="title"
            placeholder="할 일을 입력하세요"
            maxlength="200"
            required
        >

        <button type="submit">등록</button>
    </form>

    <h2>Todo 목록</h2>

    <ul>
        {% for todo in todos %}
            <li>
                {{ todo.title }}
                {% if todo.is_completed %}
                    (완료)
                {% else %}
                    (미완료)
                {% endif %}
            </li>
        {% empty %}
            <li>등록된 Todo가 없습니다.</li>
        {% endfor %}
    </ul>
</body>
</html>
